[package]
name = "bjorst-clerk-axum"
version = "0.1.0"
edition = "2021"
authors = ["Bjorst Engineering <engineering@bjorst.com>"]
license = "MIT"
description = "Clerk JWT verification for Axum"

[dependencies]
http        = { version = "1" }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# 10.3+: RUSTSEC type confusion fixed. From 10 a crypto backend is chosen by
# feature; `rust_crypto` keeps the build pure Rust.
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
thiserror   = "2"
tracing     = "0.1"
tokio       = { version = "1", features = ["time"] }

# Optional — only pulled in with the `webhook` feature.
hmac        = { version = "0.12", optional = true }
sha2        = { version = "0.10", optional = true }
base64      = { version = "0.22", optional = true }

[features]
default = []
# Svix-signed Clerk webhook signature verification (verify_webhook).
webhook = ["dep:hmac", "dep:sha2", "dep:base64"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
